name: Verify claims

# The skills in this repository make version-specific claims about Laravel and a
# few packages. This suite asserts those claims against the *latest* releases, so
# a claim that has gone stale fails here rather than misleading someone months
# later. The lock file is deliberately not committed for the same reason.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so drift surfaces without anyone touching the repo.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  claims:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        working-directory: tests
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Verify the claims the skills make
        working-directory: tests
        run: vendor/bin/phpunit
